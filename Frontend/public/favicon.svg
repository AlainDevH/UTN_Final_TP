<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <!-- Gradiente para el marco redondeado (púrpura a cian) -->
    <linearGradient id="cw-box-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9333ea"/>
      <stop offset="35%" stop-color="#7c3aed"/>
      <stop offset="70%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <!-- Gradiente para el checkmark estilizado con brillo (violeta a cian eléctrico) -->
    <linearGradient id="cw-check-grad" x1="0%" y1="85%" x2="100%" y2="15%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="35%" stop-color="#6366f1"/>
      <stop offset="70%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#00f2fe"/>
    </linearGradient>

    <!-- Efecto sutil de resplandor neón -->
    <filter id="cw-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#8b5cf6" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Fondo oscuro suave para contraste en cualquier pestaña -->
  <rect width="120" height="120" rx="28" fill="#0b0d14"/>

  <g filter="url(#cw-glow)">
    <!-- Marco redondeado abierto en la esquina superior derecha -->
    <path d="M 64 22 H 36 C 24 22 15 31 15 43 V 77 C 15 89 24 98 36 98 H 70 C 82 98 91 89 91 77 V 52"
          fill="none"
          stroke="url(#cw-box-grad)"
          stroke-width="12"
          stroke-linecap="round"
          stroke-linejoin="round"/>

    <!-- Checkmark estilizado que atraviesa hacia afuera -->
    <path d="M 32 58 L 50 76 L 99 26"
          fill="none"
          stroke="url(#cw-check-grad)"
          stroke-width="13"
          stroke-linecap="round"
          stroke-linejoin="round"/>
  </g>
</svg>
